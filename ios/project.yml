name: KayakMotor
options:
  bundleIdPrefix: com.pawel.kayak
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: "1" # iPhone only (MVP)
targets:
  # Unit 0 — bramka de-risk. Throwaway app: dowód łączności iPhone↔192.168.4.1.
  DeRiskProbe:
    type: application
    platform: iOS
    sources:
      - path: DeRiskProbe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pawel.kayak.derisk
        CODE_SIGN_ENTITLEMENTS: DeRiskProbe/DeRiskProbe.entitlements
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Łączy się z silnikiem kajaka (AP kayak-motor) po Wi‑Fi, by wysłać komendę i odbierać telemetrię."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
