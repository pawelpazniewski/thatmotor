<svg xmlns="http://www.w3.org/2000/svg" width="860" height="820" viewBox="0 0 860 820" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="hatch2" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#b6b6b6" stroke-width="2"/>
    </pattern>
    <marker id="ld" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#444"/>
    </marker>
    <marker id="rot" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1565c0"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="860" height="820" fill="#fbfbfb"/>
  <text x="40" y="46" font-size="25" font-weight="bold" fill="#222">Sterowanie przez redukcję zębatą (wzorzec Minn Kota)</text>
  <text x="40" y="73" font-size="14.5" fill="#666">Widok z góry, wzdłuż osi trzonu. Silnik z boku → mały zębnik → DUŻE koło na trzonie. Trzon w łożysku.</text>

  <!-- ===== MOTOR ===== -->
  <rect x="288" y="92" width="84" height="104" rx="8" fill="#8a8f96" stroke="#4f545b" stroke-width="2"/>
  <circle cx="330" cy="120" r="6" fill="#caa" stroke="#4f545b"/>
  <text x="330" y="150" font-size="13" fill="#fff" text-anchor="middle">SILNIK</text>
  <text x="330" y="168" font-size="11" fill="#e6e6e6" text-anchor="middle">sterujący</text>
  <!-- motor shaft -->
  <rect x="324" y="196" width="12" height="22" fill="#bdbdbd" stroke="#555" stroke-width="1"/>

  <!-- ===== PINION ===== -->
  <circle cx="330" cy="246" r="28" fill="#3a3a3a"/>
  <circle cx="330" cy="246" r="28" fill="none" stroke="#111" stroke-width="9" stroke-dasharray="8 6"/>
  <circle cx="330" cy="246" r="6" fill="#777"/>
  <text x="330" y="250" font-size="9.5" fill="#eee" text-anchor="middle">zębnik</text>

  <!-- ===== BIG GEAR ON SHAFT ===== -->
  <circle cx="330" cy="430" r="148" fill="#c9d7b0" stroke="#7d8a62" stroke-width="2"/>
  <circle cx="330" cy="430" r="150" fill="none" stroke="#5d6b42" stroke-width="14" stroke-dasharray="13 10"/>
  <text x="330" y="365" font-size="14" font-weight="bold" fill="#3c4a23" text-anchor="middle">DUŻE koło</text>
  <text x="330" y="383" font-size="12.5" fill="#3c4a23" text-anchor="middle">na trzonie</text>

  <!-- bearing + shaft at center -->
  <circle cx="330" cy="430" r="50" fill="#d8d8d8" stroke="#555" stroke-width="2"/>
  <circle cx="330" cy="430" r="50" fill="none" stroke="#555" stroke-width="2"/>
  <circle cx="306" cy="430" r="7" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <circle cx="354" cy="430" r="7" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <circle cx="330" cy="406" r="7" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <circle cx="330" cy="454" r="7" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <circle cx="330" cy="430" r="24" fill="#9ec5e8" stroke="#3a6ea5" stroke-width="2"/>
  <text x="330" y="434" font-size="10" fill="#1b3a5b" text-anchor="middle">trzon</text>

  <!-- rotation arc -->
  <path d="M 250 300 A 110 110 0 0 1 410 300" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#rot)"/>
  <text x="330" y="300" font-size="12" fill="#1565c0" text-anchor="middle">skręt</text>

  <!-- ===== LABELS ===== -->
  <g font-size="13.5" fill="#333">
    <!-- motor -->
    <line x1="372" y1="140" x2="560" y2="120" stroke="#444" stroke-width="1" marker-end="url(#ld)" stroke-dasharray="2 2"/>
    <text x="566" y="112" font-weight="bold">Silnik sterujący</text>
    <text x="566" y="130">ręcznie: Twoje serwo.</text>
    <text x="566" y="148">Spot-Lock: silnik ciągły + enkoder.</text>

    <!-- pinion -->
    <line x1="302" y1="246" x2="120" y2="220" stroke="#444" stroke-width="1" marker-end="url(#ld)" stroke-dasharray="2 2"/>
    <text x="40" y="206" font-weight="bold">Zębnik (pinion)</text>
    <text x="40" y="224">mała liczba zębów (np. 12).</text>
    <text x="40" y="242">metal — wytrzymalszy niż druk.</text>

    <!-- big gear -->
    <line x1="478" y1="430" x2="600" y2="430" stroke="#444" stroke-width="1" marker-end="url(#ld)" stroke-dasharray="2 2"/>
    <text x="606" y="412" font-weight="bold" fill="#3c4a23">DUŻE koło na trzonie</text>
    <text x="606" y="430">duża średnica = dużo zębów (np. 60+).</text>
    <text x="606" y="448">→ większy moment;</text>
    <text x="606" y="466">→ luz 1 zęba = znikomy ułamek skrętu</text>
    <text x="606" y="484">  (znika odczuwalny backlash).</text>

    <!-- bearing -->
    <line x1="282" y1="455" x2="120" y2="500" stroke="#444" stroke-width="1" marker-end="url(#ld)" stroke-dasharray="2 2"/>
    <text x="40" y="520" font-weight="bold" fill="#155724">Łożysko trzonu</text>
    <text x="40" y="538">przenosi ciężar + napór wody.</text>
    <text x="40" y="556">Serwo/silnik tylko skręca.</text>
  </g>

  <!-- ===== RATIO BOX ===== -->
  <rect x="40" y="600" width="780" height="78" rx="8" fill="#fff3cd" stroke="#c8a533" stroke-width="2"/>
  <text x="60" y="628" font-size="16" font-weight="bold" fill="#7a5d00">Przełożenie (redukcja) = (zęby DUŻEGO koła) / (zęby zębnika)</text>
  <text x="60" y="652" font-size="13.5" fill="#5c4700">Np. 60 / 12 = 5:1 → 5× moment, serwo 270° daje wtedy 270/5 = 54° skrętu trzonu. Dobierz zęby pod żądany zakres+moment.</text>
  <text x="60" y="670" font-size="13.5" fill="#5c4700">Mało skrętu? Zmniejsz przełożenie (mniejsze koło/większy zębnik). Mało momentu? Zwiększ przełożenie albo dodaj 2. stopień.</text>

  <!-- ===== MATERIALS BOX ===== -->
  <rect x="40" y="694" width="780" height="96" rx="8" fill="#e7f1ff" stroke="#5a8ac8" stroke-width="2"/>
  <text x="60" y="720" font-size="15" font-weight="bold" fill="#1b4a82">Jak zrobić to lepiej niż druk PETG (kopiując OEM):</text>
  <text x="60" y="742" font-size="13.5" fill="#234a6e">• DUŻE koło na trzonie + metalowy zębnik  • materiał: nylon/acetal (nie PETG)  • obficie smar morski (luz + zużycie + korozja)</text>
  <text x="60" y="762" font-size="13.5" fill="#234a6e">• trzon w łożysku  • opcjonalnie anti-backlash (dzielone koło ze sprężyną) albo ślimak (samohamowny — trzyma kurs bez prądu)</text>
  <text x="60" y="782" font-size="12.5" fill="#5a7a9e">Architektura identyczna jak w Twoim obecnym układzie — zmieniasz tylko przełożenie, rozmiar koła, materiał i smar.</text>
</svg>
