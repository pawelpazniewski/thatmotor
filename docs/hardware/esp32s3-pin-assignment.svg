<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="900" viewBox="0 0 1120 900" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1120" height="900" fill="#ffffff"/>

  <!-- Title -->
  <text x="560" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#1a1a1a">ESP32-S3 N16R8 — przypisanie pinów (grupowane per urządzenie)</text>
  <text x="560" y="64" text-anchor="middle" font-size="13" fill="#666">Każda wiązka wpina się w jeden ciągły blok lewej listwy. Sygnały na płytce; 5 V z dystrybucji, masa wspólna.</text>

  <!-- ===== Device cards (far left) ===== -->
  <!-- Compass -->
  <rect x="60" y="150" width="225" height="192" rx="8" fill="#EAF2FB" stroke="#1F6FD6" stroke-width="1.6"/>
  <text x="72" y="173" font-size="15" font-weight="bold" fill="#10468f">Kompas BNO085</text>
  <line x1="60" y1="182" x2="285" y2="182" stroke="#bcd4ef"/>
  <text x="72" y="204" font-size="13" fill="#222">VCC → 3V3</text>
  <text x="72" y="227" font-size="13" fill="#222">SDA → GPIO4</text>
  <text x="72" y="250" font-size="13" fill="#222">SCL → GPIO5</text>
  <text x="72" y="273" font-size="13" fill="#222">INT → GPIO6</text>
  <text x="72" y="296" font-size="13" fill="#222">RST → GPIO7</text>
  <text x="72" y="322" font-size="12" fill="#1F6FD6">GND → masa wspólna</text>

  <!-- GPS -->
  <rect x="60" y="350" width="225" height="70" rx="8" fill="#FFF3E6" stroke="#E8740C" stroke-width="1.6"/>
  <text x="72" y="373" font-size="15" font-weight="bold" fill="#a8540a">GPS NEO-M9N</text>
  <line x1="60" y1="382" x2="285" y2="382" stroke="#f3dcc0"/>
  <text x="72" y="403" font-size="13" fill="#222">TXD → GPIO15 · +5V → buck · GND → bus</text>

  <!-- RC -->
  <rect x="60" y="428" width="225" height="120" rx="8" fill="#ECF8EE" stroke="#2E9E3F" stroke-width="1.6"/>
  <text x="72" y="451" font-size="15" font-weight="bold" fill="#1d6e2a">Odbiornik RC</text>
  <line x1="60" y1="460" x2="285" y2="460" stroke="#cfe9d4"/>
  <text x="72" y="482" font-size="13" fill="#222">CH1 → GPIO16 · CH2 → GPIO17</text>
  <text x="72" y="505" font-size="13" fill="#222">CH3 → GPIO8 · CH4 → GPIO18</text>
  <text x="72" y="530" font-size="12" fill="#2E9E3F">+5V → buck · GND → bus</text>

  <!-- Outputs -->
  <rect x="60" y="556" width="225" height="116" rx="8" fill="#F5EEFB" stroke="#7B2FBE" stroke-width="1.6"/>
  <text x="72" y="579" font-size="15" font-weight="bold" fill="#5a1e8f">Wyjścia</text>
  <line x1="60" y1="588" x2="285" y2="588" stroke="#e3d3f0"/>
  <text x="72" y="610" font-size="13" fill="#222">Serwo → GPIO9</text>
  <text x="72" y="633" font-size="13" fill="#222">ESC → GPIO10</text>
  <text x="72" y="658" font-size="12" fill="#7B2FBE">serwo +5V → buck · ESC + → akum · masy → bus</text>

  <!-- leader lines card -> pin block -->
  <path d="M285,246 C295,246 290,250 300,250" fill="none" stroke="#1F6FD6" stroke-width="1.5"/>
  <path d="M285,385 C295,385 290,384 300,384" fill="none" stroke="#E8740C" stroke-width="1.5"/>
  <path d="M285,488 C295,488 290,426 300,426" fill="none" stroke="#2E9E3F" stroke-width="1.5"/>
  <path d="M285,614 C295,614 290,594 300,594" fill="none" stroke="#7B2FBE" stroke-width="1.5"/>

  <!-- ===== Board ===== -->
  <rect x="518" y="150" width="244" height="620" rx="6" fill="#0f1115" stroke="#333" stroke-width="1.5"/>
  <rect x="548" y="78" width="184" height="74" rx="4" fill="#c9cdd2" stroke="#888"/>
  <text x="640" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">ESP32-S3-WROOM-1</text>
  <text x="640" y="126" text-anchor="middle" font-size="11" fill="#444">N16R8 · 16 MB · PSRAM 8 MB</text>

  <!-- LEFT RAIL highlight bands -->
  <!-- compass VCC (i0) -->
  <rect x="300" y="148" width="215" height="24" rx="5" fill="#EAF2FB" stroke="#1F6FD6"/>
  <!-- compass 4-7 (i3..i6) -->
  <rect x="300" y="232" width="215" height="108" rx="5" fill="#EAF2FB" stroke="#1F6FD6"/>
  <!-- gps 15 (i7) -->
  <rect x="300" y="344" width="215" height="24" rx="5" fill="#FFF3E6" stroke="#E8740C"/>
  <!-- rc 16,17,18,8 (i8..i11) -->
  <rect x="300" y="372" width="215" height="108" rx="5" fill="#ECF8EE" stroke="#2E9E3F"/>
  <!-- outputs 9,10 (i14,i15) -->
  <rect x="300" y="540" width="215" height="52" rx="5" fill="#F5EEFB" stroke="#7B2FBE"/>

  <!-- LEFT RAIL labels + pads (right-aligned at x=508, pad cx=518) -->
  <text x="508" y="164" text-anchor="end" font-size="13" fill="#10468f" font-weight="bold">Kompas · VCC → 3V3</text>
  <text x="508" y="192" text-anchor="end" font-size="12" fill="#999">3V3 (zapas)</text>
  <text x="508" y="220" text-anchor="end" font-size="12" fill="#999">RST / EN (nie używać)</text>
  <text x="508" y="248" text-anchor="end" font-size="13" fill="#10468f" font-weight="bold">Kompas · SDA → GPIO4</text>
  <text x="508" y="276" text-anchor="end" font-size="13" fill="#10468f" font-weight="bold">Kompas · SCL → GPIO5</text>
  <text x="508" y="304" text-anchor="end" font-size="13" fill="#10468f" font-weight="bold">Kompas · INT → GPIO6</text>
  <text x="508" y="332" text-anchor="end" font-size="13" fill="#10468f" font-weight="bold">Kompas · RST → GPIO7</text>
  <text x="508" y="360" text-anchor="end" font-size="13" fill="#a8540a" font-weight="bold">GPS · TXD → GPIO15</text>
  <text x="508" y="388" text-anchor="end" font-size="13" fill="#1d6e2a" font-weight="bold">RC · CH1 → GPIO16</text>
  <text x="508" y="416" text-anchor="end" font-size="13" fill="#1d6e2a" font-weight="bold">RC · CH2 → GPIO17</text>
  <text x="508" y="444" text-anchor="end" font-size="13" fill="#1d6e2a" font-weight="bold">RC · CH4 → GPIO18</text>
  <text x="508" y="472" text-anchor="end" font-size="13" fill="#1d6e2a" font-weight="bold">RC · CH3 → GPIO8</text>
  <text x="508" y="500" text-anchor="end" font-size="12" fill="#999">GPIO3 (strap, zapas)</text>
  <text x="508" y="528" text-anchor="end" font-size="12" fill="#999">GPIO46 (strap, zapas)</text>
  <text x="508" y="556" text-anchor="end" font-size="13" fill="#5a1e8f" font-weight="bold">Serwo → GPIO9</text>
  <text x="508" y="584" text-anchor="end" font-size="13" fill="#5a1e8f" font-weight="bold">ESC → GPIO10</text>
  <text x="508" y="612" text-anchor="end" font-size="12" fill="#999">GPIO11 (zapas)</text>
  <text x="508" y="640" text-anchor="end" font-size="12" fill="#999">GPIO12 (zapas)</text>
  <text x="508" y="668" text-anchor="end" font-size="12" fill="#999">GPIO13 (zapas)</text>
  <text x="508" y="696" text-anchor="end" font-size="12" fill="#999">GPIO14 (zapas)</text>
  <text x="508" y="724" text-anchor="end" font-size="13" fill="#E8740C" font-weight="bold">5V → szyna 5 V (dystrybucja)</text>
  <text x="508" y="752" text-anchor="end" font-size="13" fill="#1F6FD6" font-weight="bold">GND → masa wspólna</text>

  <g fill="#e8b84b">
    <circle cx="518" cy="160" r="4"/><circle cx="518" cy="188" r="4"/><circle cx="518" cy="216" r="4"/>
    <circle cx="518" cy="244" r="4"/><circle cx="518" cy="272" r="4"/><circle cx="518" cy="300" r="4"/>
    <circle cx="518" cy="328" r="4"/><circle cx="518" cy="356" r="4"/><circle cx="518" cy="384" r="4"/>
    <circle cx="518" cy="412" r="4"/><circle cx="518" cy="440" r="4"/><circle cx="518" cy="468" r="4"/>
    <circle cx="518" cy="496" r="4"/><circle cx="518" cy="524" r="4"/><circle cx="518" cy="552" r="4"/>
    <circle cx="518" cy="580" r="4"/><circle cx="518" cy="608" r="4"/><circle cx="518" cy="636" r="4"/>
    <circle cx="518" cy="664" r="4"/><circle cx="518" cy="692" r="4"/><circle cx="518" cy="720" r="4"/>
    <circle cx="518" cy="748" r="4"/>
  </g>

  <!-- RIGHT RAIL labels + pads (left-aligned at x=774, pad cx=762) -->
  <g fill="#e8b84b">
    <circle cx="762" cy="160" r="4"/><circle cx="762" cy="188" r="4"/><circle cx="762" cy="216" r="4"/>
    <circle cx="762" cy="244" r="4"/><circle cx="762" cy="272" r="4"/><circle cx="762" cy="300" r="4"/>
    <circle cx="762" cy="328" r="4"/><circle cx="762" cy="356" r="4"/><circle cx="762" cy="384" r="4"/>
    <circle cx="762" cy="412" r="4"/><circle cx="762" cy="440" r="4"/><circle cx="762" cy="468" r="4"/>
    <circle cx="762" cy="496" r="4"/><circle cx="762" cy="524" r="4"/><circle cx="762" cy="552" r="4"/>
    <circle cx="762" cy="580" r="4"/><circle cx="762" cy="608" r="4"/><circle cx="762" cy="636" r="4"/>
    <circle cx="762" cy="664" r="4"/><circle cx="762" cy="692" r="4"/><circle cx="762" cy="720" r="4"/>
  </g>
  <text x="774" y="164" font-size="13" fill="#1F6FD6" font-weight="bold">GND</text>
  <text x="774" y="192" font-size="12" fill="#999">GPIO43 · UART0 TX (konsola)</text>
  <text x="774" y="220" font-size="12" fill="#999">GPIO44 · UART0 RX (konsola)</text>
  <text x="774" y="248" font-size="12" fill="#555">GPIO1 (zapas)</text>
  <text x="774" y="276" font-size="12" fill="#555">GPIO2 (zapas)</text>
  <text x="774" y="304" font-size="12" fill="#555">GPIO42 (zapas)</text>
  <text x="774" y="332" font-size="12" fill="#555">GPIO41 (zapas)</text>
  <text x="774" y="360" font-size="12" fill="#555">GPIO40 (zapas)</text>
  <text x="774" y="388" font-size="12" fill="#555">GPIO39 (zapas)</text>
  <text x="774" y="416" font-size="12" fill="#555">GPIO38 (zapas)</text>
  <text x="774" y="444" font-size="12" fill="#999">GPIO37 · PSRAM (nie używać)</text>
  <text x="774" y="472" font-size="12" fill="#999">GPIO36 · PSRAM (nie używać)</text>
  <text x="774" y="500" font-size="12" fill="#999">GPIO35 · PSRAM (nie używać)</text>
  <text x="774" y="528" font-size="12" fill="#999">GPIO0 · strap (nie używać)</text>
  <text x="774" y="556" font-size="12" fill="#999">GPIO45 · strap (nie używać)</text>
  <text x="774" y="584" font-size="12" fill="#b01049" font-weight="bold">GPIO48 · RGB status (on-board)</text>
  <text x="774" y="612" font-size="12" fill="#555">GPIO47 (zapas)</text>
  <text x="774" y="640" font-size="12" fill="#555">GPIO21 (zapas)</text>
  <text x="774" y="668" font-size="12" fill="#999">GPIO20 · USB (nie używać)</text>
  <text x="774" y="696" font-size="12" fill="#999">GPIO19 · USB (nie używać)</text>
  <text x="774" y="724" font-size="13" fill="#1F6FD6" font-weight="bold">GND</text>

  <!-- ===== Notes (right) ===== -->
  <rect x="790" y="760" width="295" height="0" />
  <rect x="60" y="700" width="455" height="172" rx="8" fill="#FAFBFC" stroke="#ccc"/>
  <text x="74" y="724" font-size="14" font-weight="bold" fill="#1a1a1a">Zasilanie i masa</text>
  <text x="74" y="746" font-size="12" fill="#444">• 3,3 V: tylko piny 3V3 (góra lewej) → kompas.</text>
  <text x="74" y="766" font-size="12" fill="#444">• 5 V: GPS / RC / serwo z dystrybucji buck — NIE z jednego pinu 5V</text>
  <text x="86" y="784" font-size="12" fill="#444">ESP (serwo nie może ciągnąć prądu przez płytkę).</text>
  <text x="74" y="804" font-size="12" fill="#444">• GND: jedna wspólna szyna — ESP + buck + wszystkie urządzenia.</text>
  <text x="74" y="824" font-size="12" fill="#444">• ESC: zasilanie z akumulatora przez regulator (nie z ESP).</text>
  <text x="74" y="848" font-size="12" fill="#a23">• Pull-down ~10 kΩ na GPIO9 (serwo) i GPIO10 (ESC) → GND.</text>

  <!-- legend chips -->
  <rect x="540" y="700" width="545" height="172" rx="8" fill="#FAFBFC" stroke="#ccc"/>
  <text x="554" y="724" font-size="14" font-weight="bold" fill="#1a1a1a">Legenda</text>
  <rect x="554" y="738" width="18" height="14" rx="3" fill="#EAF2FB" stroke="#1F6FD6"/>
  <text x="580" y="750" font-size="12" fill="#222">Kompas (I2C + INT/RST), zasilany 3,3 V</text>
  <rect x="554" y="762" width="18" height="14" rx="3" fill="#FFF3E6" stroke="#E8740C"/>
  <text x="580" y="774" font-size="12" fill="#222">GPS (UART RX, receive-only)</text>
  <rect x="554" y="786" width="18" height="14" rx="3" fill="#ECF8EE" stroke="#2E9E3F"/>
  <text x="580" y="798" font-size="12" fill="#222">Odbiornik RC (4 kanały, MCPWM capture)</text>
  <rect x="554" y="810" width="18" height="14" rx="3" fill="#F5EEFB" stroke="#7B2FBE"/>
  <text x="580" y="822" font-size="12" fill="#222">Wyjścia serwo + ESC (LEDC PWM)</text>
  <text x="580" y="846" font-size="12" fill="#999">szare = niedostępne (flash/PSRAM, USB, konsola, strap)</text>
  <text x="580" y="864" font-size="12" fill="#b01049">GPIO48 = wbudowana dioda RGB WS2812 (sygnalizacja stanu)</text>
</svg>
